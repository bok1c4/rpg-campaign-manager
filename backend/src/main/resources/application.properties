spring.application.name=rpg-campaign-manager
server.port=8080

# --- Datasource (overridden by env vars in docker-compose) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rpgdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:rpg}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rpg}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# --- JWT ---
app.jwt.secret=${APP_JWT_SECRET:singidunum-rpg-campaign-manager-super-secret-key-change-me-256bit}
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

# --- springdoc / Swagger UI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# --- Static SPA: don't let Spring add cache headers that fight the SPA fallback ---
spring.web.resources.cache.cachecontrol.no-cache=true
